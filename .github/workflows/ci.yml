# Integración continua: se ejecuta en cada push a main y en cada pull request.
# - backend: tests contra PostgreSQL real y contra SeaweedFS (almacenamiento S3)
# - mobile: análisis estático y tests de Flutter
# - moderation: comprueba que el servicio de revisión de fotos es Python válido
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Credenciales efímeras solo para los contenedores de esta ejecución.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/pawparazzi_test
      TEST_DB_USER: pawparazzi
      TEST_DB_PASSWORD: ci-only-password
      S3_ACCESS_KEY: ci-only-access-key
      S3_SECRET_KEY: ci-only-secret-key
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: pawparazzi_test
          POSTGRES_USER: pawparazzi
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawparazzi -d pawparazzi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Arrancar SeaweedFS (almacenamiento S3)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            chrislusf/seaweedfs:4.48 server -ip.bind=0.0.0.0 -s3 -s3.port=8333
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8333/healthz > /dev/null && exit 0
            sleep 2
          done
          docker logs seaweedfs
          exit 1

      - name: Tests del backend (PostgreSQL + S3)
        working-directory: backend
        env:
          S3_IT_ENDPOINT: http://localhost:8333
        run: ./mvnw -B test -Dtest='*Test,*IT'

      - name: Guardar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend/target/surefire-reports

  mobile:
    name: App (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Análisis estático
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

  moderation:
    name: Revisión de fotos (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis
        run: python -m py_compile moderation/*.py
